app = "hisaba-backend"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 1
  processes = ["app"]

[deploy]
# release_command = "npx prisma db push"
# ↑ Re-enable when you change the Prisma schema. Disabled because
#   Fly.io (ams) cannot always reach Neon (us-east-1) during deploys.

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
