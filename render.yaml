services:
  - type: web
    name: hisaba-backend
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PRISMA_ACCELERATE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
